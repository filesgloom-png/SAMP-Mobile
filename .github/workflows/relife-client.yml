name: ReLife Client APK

on:
  push:
    branches:
      - GTA-2.11
  workflow_dispatch:

jobs:
  build:
    name: Build GTA-2.11 Android Client
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;26.2.11394342"

      - name: Restore native source archive
        shell: bash
        run: |
          cd app/src/main/cpp
          rm -rf samp
          unzip -q cpp.zip
          test -d samp
          echo "Native source restored:"
          find samp -maxdepth 2 -type f | head -50

      - name: Remove duplicate BASS JNI libraries
        shell: bash
        run: |
          find app/src/main/jniLibs -type f \
            \( -name 'libbass.so' -o -name 'libbass_ssl.so' \) \
            -print -delete || true
          echo "Remaining BASS files:"
          find app/src/main -type f \
            \( -name 'libbass.so' -o -name 'libbass_ssl.so' \) \
            -print

      - name: Verify Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/GTA-2.11-debug.apk
          ls -lh app/build/outputs/apk/debug/GTA-2.11-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReLife-GTA-2.11-debug
          path: app/build/outputs/apk/debug/GTA-2.11-debug.apk
          if-no-files-found: error
